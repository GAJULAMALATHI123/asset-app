<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>admin assets</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.153.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "adminasset": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="adminasset"
        data-id="container"
        data-settings='{"id" : "adminasset"}'
        data-handle-validation="true"
    ></div>

    <style>
      #assetAppSignOut { position: fixed; top: 12px; right: 16px; z-index: 10000; padding: 9px 14px;
        border: 1px solid #b8c9d9; border-radius: 8px; background: #fff; color: #173b57;
        font: 600 13px Arial, sans-serif; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
      #assetAppSignOut:hover { background: #edf6fc; }
    </style>
    <button id="assetAppSignOut" type="button" aria-label="Sign out of Asset Lifecycle">Sign Out</button>
    <script>
      (function () {
        var button = document.getElementById('assetAppSignOut');
        if (!button) return;
        button.addEventListener('click', async function () {
          button.disabled = true;
          button.textContent = 'Signing out…';
          try {
            await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin', cache: 'no-store' });
          } catch (_) { /* Always leave the dashboard even if the network request fails. */ }
          window.location.replace('/login/index.html');
        });
      })();
    </script>
  </body>
</html>
